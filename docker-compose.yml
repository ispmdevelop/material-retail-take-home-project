services:
  postgres:
    image: postgres:17-alpine
    container_name: material-retail-postgres
    environment:
      POSTGRES_USER: material
      POSTGRES_PASSWORD: material_secret
      POSTGRES_DB: material_retail
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U material -d material_retail']
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
